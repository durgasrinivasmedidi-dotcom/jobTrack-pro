<!DOCTYPE html>
<html>

<head>

    <title>Edit Job - JobTrack Pro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Edit Job Application</h1>

    <div class="card">

        <form method="POST">

            <label>Company Name</label>

            <input
                type="text"
                name="company"
                value="{{ job.company }}"
                required
            >


            <label>Job Role</label>

            <input
                type="text"
                name="role"
                value="{{ job.role }}"
                required
            >


            <label>Application Date</label>

            <input
                type="date"
                name="application_date"
                value="{{ job.application_date }}"
                required
            >


            <label>Status</label>

            <select name="status" required>

                <option value="Applied"
                    {% if job.status == "Applied" %}selected{% endif %}>
                    Applied
                </option>

                <option value="Interview"
                    {% if job.status == "Interview" %}selected{% endif %}>
                    Interview
                </option>

                <option value="Selected"
                    {% if job.status == "Selected" %}selected{% endif %}>
                    Selected
                </option>

                <option value="Rejected"
                    {% if job.status == "Rejected" %}selected{% endif %}>
                    Rejected
                </option>

            </select>


            <button type="submit">
                Update Job
            </button>

        </form>


        <br>

        <a href="/">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
